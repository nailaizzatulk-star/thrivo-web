version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: thrivo_db_container
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: thrivo_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: .
    container_name: thrivo_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - DATABASE_URL=postgresql://postgres:postgrespassword@postgres:5432/thrivo_db
      - JWT_SECRET=supersecretkeythrivo
      - CLOUDINARY_CLOUD_NAME=hfyllg1j
      - CLOUDINARY_API_KEY=499838628181868
      - CLOUDINARY_API_SECRET=59iebEcmicKo6MzJbszaqM7xYGo
    depends_on:
      - postgres

volumes:
  postgres_data: